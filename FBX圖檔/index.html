<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>動物城市跑酷</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0c1e;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;color:#eaf2ff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;top:14px;left:16px;font-size:22px;font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;line-height:1.5;z-index:5}
  #hud small{font-size:13px;font-weight:500;opacity:.7}
  #best{position:fixed;top:14px;right:16px;font-size:14px;opacity:.75;pointer-events:none;z-index:5}
  #modelTip{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
    font-size:13px;background:rgba(255,176,87,.15);border:1px solid rgba(255,176,87,.4);
    padding:6px 14px;border-radius:20px;pointer-events:none;z-index:5;white-space:nowrap}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:rgba(8,10,24,.72);backdrop-filter:blur(3px);text-align:center;padding:20px;z-index:10}
  #overlay.hidden{display:none}
  #overlay h2{font-size:34px}
  #overlay p{line-height:1.8;opacity:.92;max-width:500px}
  kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    border-bottom-width:2px;border-radius:6px;padding:1px 8px;font-family:inherit}
  button.start{cursor:pointer;border:none;border-radius:12px;padding:12px 30px;font-size:17px;font-weight:700;
    color:#06121f;background:#4fd1ff;transition:transform .08s,filter .15s}
  button.start:hover{filter:brightness(1.08)} button.start:active{transform:translateY(1px)}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.55;pointer-events:none;z-index:5}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:8}
  .tbtn{position:absolute;bottom:24px;width:78px;height:78px;border-radius:50%;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;
    color:#fff;backdrop-filter:blur(2px)}
  .tbtn:active{background:rgba(79,209,255,.35)}
  #bLeft{left:24px}
  #bRight{left:116px}
  #bJump{right:24px;bottom:36px;width:104px;height:104px;font-size:26px;
    background:rgba(87,255,176,.14);border-color:rgba(87,255,176,.4)}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">得分 <span id="score">0</span><br><small id="mult">連分 x1</small></div>
<div id="best">最佳 0</div>
<div id="modelTip" style="display:none">⚠ 動物模型尚未載入（animal.glb 放同資料夾）</div>
<div id="hint">← → 切道 · 空格/跳躍鍵 跳</div>

<div id="touch">
  <div class="tbtn" id="bLeft">◀</div>
  <div class="tbtn" id="bRight">▶</div>
  <div class="tbtn" id="bJump">跳</div>
</div>

<div id="overlay">
  <h2>🐾 動物城市跑酷</h2>
  <p>扮演小動物在霓虹城市奔跑，切道、跳過障礙。<br>
     手機用下方按鈕操作：<b>◀ ▶</b> 切道 · <b>跳</b> 跳躍</p>
  <button class="start" id="btn">開始遊戲</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.getElementById('app');
const scoreEl=document.getElementById('score'), multEl=document.getElementById('mult');
const bestEl=document.getElementById('best'), overlay=document.getElementById('overlay');
const btn=document.getElementById('btn'), modelTip=document.getElementById('modelTip');

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0c1e,35,120);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x6677aa,.9));
const moon=new THREE.DirectionalLight(0xbfd4ff,1.2);
moon.position.set(6,18,8); moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-20;moon.shadow.camera.right=20;
moon.shadow.camera.top=20;moon.shadow.camera.bottom=-20;
scene.add(moon);

const LANES=[-2.2,0,2.2];
const road=new THREE.Mesh(new THREE.BoxGeometry(8,.4,260),
  new THREE.MeshStandardMaterial({color:0x14162a,roughness:.95}));
road.position.set(0,-.2,-90); road.receiveShadow=true; scene.add(road);
for(let i=0;i<3;i++){
  const line=new THREE.Mesh(new THREE.PlaneGeometry(.12,260),
    new THREE.MeshBasicMaterial({color:0x4fd1ff,transparent:true,opacity:.4}));
  line.rotation.x=-Math.PI/2; line.position.set(LANES[i],.02,-90); scene.add(line);
}
[-3.9,3.9].forEach(x=>{
  const e=new THREE.Mesh(new THREE.BoxGeometry(.2,1.2,260),
    new THREE.MeshStandardMaterial({color:0x223,emissive:0x4fd1ff,emissiveIntensity:.6}));
  e.position.set(x,.4,-90); scene.add(e);
});

const buildingMat=new THREE.MeshStandardMaterial({color:0x1b2350,roughness:.7,emissive:0x0a1030,emissiveIntensity:.4});
function addBuilding(x,z,h){
  const b=new THREE.Mesh(new THREE.BoxGeometry(6,h,10),buildingMat);
  b.position.set(x,h/2,z); scene.add(b);
  const n=Math.floor(h/3);
  for(let i=0;i<n;i++){
    const w=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.2),
      new THREE.MeshBasicMaterial({color:Math.random()<.5?0x4fd1ff:0xffb057,transparent:true,opacity:Math.random()*.9+.1}));
    w.position.set(x+(Math.random()<.5?-3.02:3.02),2+i*3,z+(Math.random()-.5)*6);
    w.rotation.y=(x<0?Math.PI/2:-Math.PI/2);
    scene.add(w);
  }
}
for(let z=20; z>-260; z-=14){
  addBuilding(-11,z,10+Math.random()*22);
  addBuilding(11,z+7,10+Math.random()*22);
}
const glow=new THREE.Mesh(new THREE.PlaneGeometry(200,60),
  new THREE.MeshBasicMaterial({color:0x1a2a55,transparent:true,opacity:.5,fog:false}));
glow.position.set(0,20,-160); scene.add(glow);

const OB_COLORS=[0xff5470,0x57ffb0,0xffb057,0x4fd1ff];
const obstacles=[];
function makeObstacle(){
  const type=Math.floor(Math.random()*3);
  let mesh,h;
  if(type===0){h=1.2;mesh=new THREE.Mesh(new THREE.BoxGeometry(2,h,2),
    new THREE.MeshStandardMaterial({color:OB_COLORS[0]}));}
  else if(type===1){h=1;mesh=new THREE.Mesh(new THREE.BoxGeometry(2.4,h,1),
    new THREE.MeshStandardMaterial({color:0xff5470,emissive:0x551018}));}
  else{
    h=2;mesh=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,3.2),
      new THREE.MeshStandardMaterial({color:OB_COLORS[2]}));
    body.position.y=0.5;mesh.add(body);
    const top=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,1.6),
      new THREE.MeshStandardMaterial({color:0x223}));
    top.position.y=1.3;mesh.add(top);
  }
  mesh.userData={h,scored:false};scene.add(mesh);return mesh;
}

let animal=null,mixer=null,actions={},currentAction=null;
function findAction(clips,name){return clips.find(c=>c.name.toLowerCase().includes(name));}
function playAnim(name){
  if(!mixer||!actions[name])return;
  const next=actions[name];
  if(currentAction&&currentAction!==next)currentAction.crossFadeTo(next,.3);
  next.reset().fadeIn(.2).play();currentAction=next;
}
const fallback=new THREE.Mesh(new THREE.SphereGeometry(.8,16,16),
  new THREE.MeshStandardMaterial({color:0xffb057,emissive:0x442200}));
fallback.position.set(0,.8,0);scene.add(fallback);

new GLTFLoader().load('animal.glb',(g)=>{
  animal=g.scene;
  const box=new THREE.Box3().setFromObject(animal);
  const size=box.getSize(new THREE.Vector3());
  const scale=1.6/Math.max(size.x,size.y,size.z);
  animal.scale.setScalar(scale);animal.position.set(0,0,0);
  scene.add(animal);fallback.visible=false;modelTip.style.display='none';
  mixer=new THREE.AnimationMixer(animal);
  const c=g.animations||[];
  ['run','jump','idle','walk','fall','hit','dead','sit','sit_down'].forEach(n=>{
    const clip=findAction(c,n);if(clip)actions[n]=mixer.clipAction(clip);
  });
  const startName=['run','walk','idle'].find(n=>actions[n]);
  if(startName)playAnim(startName);
},undefined,()=>{modelTip.style.display='block';});

let running=false,last=0,score=0,best=+(localStorage.getItem('animal_best')||0);
let speed=22,t=0,dist=0,distToNext=14,spawnGap=14;
let lane=1,laneX=0,vy=0,grounded=true,jumps=0,inv=0,shake=0;
const GRAV=-38,JUMP=14;
bestEl.textContent='最佳 '+Math.floor(best);

function reset(){
  score=0;t=0;dist=0;speed=22;distToNext=14;
  lane=1;laneX=0;vy=0;grounded=true;jumps=0;inv=0;shake=0;
  if(animal){animal.position.set(0,0,0);animal.rotation.set(0,0,0);}
  fallback.position.set(0,.8,0);
  for(const o of obstacles){scene.remove(o);disposeObj(o);}
  obstacles.length=0;playAnim('run');updHUD();
}
function disposeObj(o){if(o.traverse)o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material)n.material.dispose();});}
function updHUD(){
  scoreEl.textContent=Math.floor(score);
  multEl.textContent='連分 x'+(1+Math.min(9,Math.floor(dist/120)));
  bestEl.textContent='最佳 '+Math.floor(best);
}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop);}
function endGame(){
  running=false;
  if(score>best){best=Math.floor(score);localStorage.setItem('animal_best',best);}
  overlay.querySelector('h2').textContent='💥 撞到了！';
  overlay.querySelector('p').innerHTML='最終得分 <b style="color:#4fd1ff">'+Math.floor(score)+'</b><br>再跑一次挑戰更高分！';
  btn.textContent='再玩一次';
  overlay.classList.remove('hidden');
  bestEl.textContent='最佳 '+Math.floor(best);
  playAnim(['fall','hit','dead','sit'].find(n=>actions[n])||'idle');
}
function doJump(){if(jumps<2){vy=JUMP*(jumps===0?1:.85);grounded=false;jumps++;playAnim('jump');}}
function setLane(i){lane=Math.max(0,Math.min(2,i));}

addEventListener('keydown',e=>{
  if(!running)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA')setLane(lane-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')setLane(lane+1);
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();doJump();}
});
function bind(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();fn();});
}
bind('bLeft',()=>setLane(lane-1));
bind('bRight',()=>setLane(lane+1));
bind('bJump',()=>doJump());
renderer.domElement.addEventListener('pointerdown',()=>{if(running)doJump();});
let tx=0;
addEventListener('touchstart',e=>{if(e.touches.length)tx=e.touches[0].clientX;});
addEventListener('touchend',e=>{
  if(!running)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40)setLane(lane+(dx>0?1:-1));
});
btn.addEventListener('click',start);

function playerY(){return animal?animal.position.y:fallback.position.y;}
function setPlayerY(y){if(animal)animal.position.y=y;else fallback.position.y=y;}

function update(dt){
  t+=dt;speed+=dt*1.2;dist+=speed*dt;
  const mult=1+Math.min(9,Math.floor(dist/120));
  score+=speed*dt*mult*0.1;
  laneX=THREE.MathUtils.lerp(laneX,LANES[lane],Math.min(1,dt*12));
  if(animal){animal.position.x=laneX;animal.rotation.z=THREE.MathUtils.lerp(animal.rotation.z,(LANES[lane]-laneX)*-.4,dt*10);}
  else fallback.position.x=laneX;
  if(!grounded){
    vy+=GRAV*dt;const ny=playerY()+vy*dt;
    if(ny<=0){setPlayerY(0);grounded=true;jumps=0;vy=0;playAnim('run');}
    else setPlayerY(ny);
  }
  if(animal)animal.rotation.x=grounded?0:THREE.MathUtils.lerp(animal.rotation.x,-.4,dt*8);
  inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*2);
  distToNext-=speed*dt;
  if(distToNext<=0){
    const o=makeObstacle();const li=Math.floor(Math.random()*3);
    o.position.set(LANES[li],0,-dist);
    if(Math.random()<.25){const o2=makeObstacle();
      o2.position.set(LANES[(li+1+Math.floor(Math.random()*2))%3],0,-dist);obstacles.push(o2);}
    obstacles.push(o);
    spawnGap=Math.max(8,15-speed*0.15);distToNext=spawnGap+Math.random()*6;
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.position.z+=speed*dt;
    if(o.position.z>-1&&o.position.z<1.2&&inv<=0){
      const dx=Math.abs(o.position.x-laneX);
      if(dx<1.4&&playerY()<o.userData.h+0.2&&playerY()<o.userData.h){shake=1;endGame();return;}
    }
    if(o.position.z>10){scene.remove(o);disposeObj(o);obstacles.splice(i,1);}
  }
  camera.position.set(laneX*.5,4+playerY()*.4,7);
  camera.lookAt(laneX*.5,1.4,-10);
  if(shake>0)camera.position.x+=(Math.random()-.5)*shake;
  if(mixer)mixer.update(dt);
  updHUD();
}
function loop(now){
  if(!running)return;
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  update(dt);renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.addEventListener('dblclick',e=>e.preventDefault());
renderer.render(scene,camera);
</script>
</body>
</html>
