<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>動物城市跑酷</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0c1e;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;color:#eaf2ff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;top:14px;left:16px;font-size:22px;font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;line-height:1.5;z-index:5}
  #hud small{font-size:13px;font-weight:500;opacity:.7}
  #best{position:fixed;top:14px;right:16px;font-size:14px;opacity:.75;pointer-events:none;z-index:5}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:rgba(8,10,24,.72);backdrop-filter:blur(3px);text-align:center;padding:20px;z-index:10}
  #overlay.hidden{display:none}
  #overlay h2{font-size:34px}
  #overlay p{line-height:1.8;opacity:.92;max-width:500px}
  button.start{cursor:pointer;border:none;border-radius:12px;padding:12px 30px;font-size:17px;font-weight:700;
    color:#06121f;background:#4fd1ff;transition:transform .08s,filter .15s}
  button.start:hover{filter:brightness(1.08)} button.start:active{transform:translateY(1px)}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.55;pointer-events:none;z-index:5}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:8}
  .tbtn{position:absolute;bottom:24px;width:78px;height:78px;border-radius:50%;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;
    color:#fff;backdrop-filter:blur(2px)}
  .tbtn:active{background:rgba(79,209,255,.35)}
  #bLeft{left:24px}
  #bRight{left:116px}
  #bJump{right:24px;bottom:36px;width:104px;height:104px;font-size:26px;
    background:rgba(87,255,176,.14);border-color:rgba(87,255,176,.4)}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">得分 <span id="score">0</span><br><small id="mult">連分 x1</small></div>
<div id="best">最佳 0</div>
<div id="hint">← → 切道 · 空格/跳躍鍵 跳</div>

<div id="touch">
  <div class="tbtn" id="bLeft">◀</div>
  <div class="tbtn" id="bRight">▶</div>
  <div class="tbtn" id="bJump">跳</div>
</div>

<div id="overlay">
  <h2>🐾 動物城市跑酷</h2>
  <p>扮演小狐狸在霓虹城市奔跑，切道、跳過障礙。<br>
     手機用下方按鈕操作：<b>◀ ▶</b> 切道 · <b>跳</b> 跳躍</p>
  <button class="start" id="btn">開始遊戲</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const app=document.getElementById('app');
const scoreEl=document.getElementById('score');
const multEl=document.getElementById('mult');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const btn=document.getElementById('btn');

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0c1e,35,120);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x6677aa,.9));
const moon=new THREE.DirectionalLight(0xbfd4ff,1.2);
moon.position.set(6,18,8);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-20;moon.shadow.camera.right=20;
moon.shadow.camera.top=20;moon.shadow.camera.bottom=-20;
scene.add(moon);

const LANES=[-2.2,0,2.2];
const road=new THREE.Mesh(
  new THREE.BoxGeometry(8,.4,260),
  new THREE.MeshStandardMaterial({color:0x14162a,roughness:.95})
);
road.position.set(0,-.2,-90);
road.receiveShadow=true;
scene.add(road);
for(let i=0;i<3;i++){
  const line=new THREE.Mesh(
    new THREE.PlaneGeometry(.12,260),
    new THREE.MeshBasicMaterial({color:0x4fd1ff,transparent:true,opacity:.4})
  );
  line.rotation.x=-Math.PI/2;
  line.position.set(LANES[i],.02,-90);
  scene.add(line);
}
[-3.9,3.9].forEach(x=>{
  const e=new THREE.Mesh(
    new THREE.BoxGeometry(.2,1.2,260),
    new THREE.MeshStandardMaterial({color:0x223,emissive:0x4fd1ff,emissiveIntensity:.6})
  );
  e.position.set(x,.4,-90);
  scene.add(e);
});

const buildingMat=new THREE.MeshStandardMaterial({
  color:0x1b2350,roughness:.7,emissive:0x0a1030,emissiveIntensity:.4
});
function addBuilding(x,z,h){
  const b=new THREE.Mesh(new THREE.BoxGeometry(6,h,10),buildingMat);
  b.position.set(x,h/2,z);
  scene.add(b);
  const n=Math.floor(h/3);
  for(let i=0;i<n;i++){
    const w=new THREE.Mesh(
      new THREE.PlaneGeometry(1.2,1.2),
      new THREE.MeshBasicMaterial({
        color:Math.random()<.5?0x4fd1ff:0xffb057,
        transparent:true,
        opacity:Math.random()*.9+.1
      })
    );
    w.position.set(x+(Math.random()<.5?-3.02:3.02),2+i*3,z+(Math.random()-.5)*6);
    w.rotation.y=x<0?Math.PI/2:-Math.PI/2;
    scene.add(w);
  }
}
for(let z=20;z>-260;z-=14){
  addBuilding(-11,z,10+Math.random()*22);
  addBuilding(11,z+7,10+Math.random()*22);
}
const glow=new THREE.Mesh(
  new THREE.PlaneGeometry(200,60),
  new THREE.MeshBasicMaterial({color:0x1a2a55,transparent:true,opacity:.5,fog:false})
);
glow.position.set(0,20,-160);
scene.add(glow);

function makeMat(color,emissive=0x000000,intensity=0){
  return new THREE.MeshStandardMaterial({
    color,roughness:.55,metalness:.05,emissive,emissiveIntensity:intensity
  });
}

function addPart(parent,geo,mat,x,y,z,cast=true){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

function makeFox(){
  const fox=new THREE.Group();
  const orange=makeMat(0xff8a3d);
  const cream=makeMat(0xffe0b0);
  const dark=makeMat(0x2a1a12);
  const white=makeMat(0xfff6ea);
  const eye=makeMat(0x1a120c,0x4fd1ff,.15);

  const body=addPart(fox,new THREE.SphereGeometry(.42,16,12),orange,0,.72,0);
  body.scale.set(1,.85,1.25);
  const belly=addPart(fox,new THREE.SphereGeometry(.28,12,10),cream,0,.58,.12);
  belly.scale.set(.9,.7,1.1);

  const head=new THREE.Group();
  head.position.set(0,1.12,.38);
  fox.add(head);
  addPart(head,new THREE.SphereGeometry(.32,16,12),orange,0,0,0);
  const snout=addPart(head,new THREE.SphereGeometry(.14,12,10),cream,0,-.06,.26);
  snout.scale.set(1,.7,1.1);
  addPart(head,new THREE.SphereGeometry(.05,8,8),dark,0,-.04,.38);
  addPart(head,new THREE.SphereGeometry(.055,8,8),eye,.11,.06,.26);
  addPart(head,new THREE.SphereGeometry(.055,8,8),eye,-.11,.06,.26);
  addPart(head,new THREE.SphereGeometry(.03,8,8),white,.13,.08,.3);
  addPart(head,new THREE.SphereGeometry(.03,8,8),white,-.09,.08,.3);

  const earL=addPart(head,new THREE.ConeGeometry(.12,.28,8),orange,-.16,.28,-.02);
  earL.rotation.z=.2;
  const earR=addPart(head,new THREE.ConeGeometry(.12,.28,8),orange,.16,.28,-.02);
  earR.rotation.z=-.2;
  addPart(head,new THREE.ConeGeometry(.06,.14,6),cream,-.16,.24,0);
  addPart(head,new THREE.ConeGeometry(.06,.14,6),cream,.16,.24,0);

  const tail=new THREE.Group();
  tail.position.set(0,.78,-.42);
  fox.add(tail);
  const tailBase=addPart(tail,new THREE.SphereGeometry(.16,10,8),orange,0,0,-.18);
  tailBase.scale.set(.8,.8,1.6);
  const tailTip=addPart(tail,new THREE.SphereGeometry(.12,10,8),white,0,.08,-.42);
  tailTip.scale.set(.9,.8,1.2);

  function makeLeg(x,z){
    const leg=new THREE.Group();
    leg.position.set(x,.42,z);
    fox.add(leg);
    const thigh=addPart(leg,new THREE.CylinderGeometry(.09,.08,.34,8),orange,0,-.12,0);
    thigh.position.y=-.08;
    const paw=addPart(leg,new THREE.SphereGeometry(.09,8,8),dark,0,-.28,.02);
    paw.scale.set(1,.7,1.15);
    return {leg,thigh,paw};
  }
  const legs={
    fl:makeLeg(-.18,.22),
    fr:makeLeg(.18,.22),
    bl:makeLeg(-.18,-.22),
    br:makeLeg(.18,-.22)
  };

  fox.userData={head,tail,legs,pose:'run'};
  return fox;
}

const animal=makeFox();
scene.add(animal);

const obstacles=[];
function makeObstacle(){
  const type=Math.floor(Math.random()*3);
  let mesh,h;
  if(type===0){
    h=1.2;
    mesh=new THREE.Mesh(
      new THREE.BoxGeometry(2,h,2),
      new THREE.MeshStandardMaterial({color:0xff5470})
    );
  }else if(type===1){
    h=1;
    mesh=new THREE.Mesh(
      new THREE.BoxGeometry(2.4,h,1),
      new THREE.MeshStandardMaterial({color:0xff5470,emissive:0x551018})
    );
  }else{
    h=2;
    mesh=new THREE.Group();
    const body=new THREE.Mesh(
      new THREE.BoxGeometry(2,1,3.2),
      new THREE.MeshStandardMaterial({color:0xffb057})
    );
    body.position.y=.5;
    mesh.add(body);
    const top=new THREE.Mesh(
      new THREE.BoxGeometry(1.6,.8,1.6),
      new THREE.MeshStandardMaterial({color:0x223})
    );
    top.position.y=1.3;
    mesh.add(top);
  }
  mesh.userData={h};
  scene.add(mesh);
  return mesh;
}

function disposeObj(o){
  if(!o.traverse)return;
  o.traverse(n=>{
    if(n.geometry)n.geometry.dispose();
    if(n.material)n.material.dispose();
  });
}

let running=false,last=0,score=0,best=+(localStorage.getItem('animal_best')||0);
let speed=22,t=0,dist=0,distToNext=14;
let lane=1,laneX=0,vy=0,grounded=true,jumps=0,inv=0,shake=0;
const GRAV=-38,JUMP=14;
bestEl.textContent='最佳 '+Math.floor(best);

function playPose(name){
  animal.userData.pose=name;
}

function animateFox(dt){
  const {head,tail,legs,pose}=animal.userData;
  const run=pose==='run';
  const jump=pose==='jump';
  const fall=pose==='fall';
  const cycle=t*14;
  const swing=run?Math.sin(cycle)*.7:jump?0.55:fall?0.15:0;
  const bounce=run?Math.abs(Math.sin(cycle))*0.06:0;

  animal.position.y+=(bounce-0)*0;
  head.rotation.x=THREE.MathUtils.lerp(head.rotation.x,jump?-0.25:fall?0.35:Math.sin(cycle)*.08,dt*10);
  head.rotation.y=THREE.MathUtils.lerp(head.rotation.y,run?Math.sin(cycle*0.5)*.08:0,dt*8);
  tail.rotation.x=THREE.MathUtils.lerp(tail.rotation.x,jump?0.4:fall?-0.2:-0.35+Math.sin(cycle*1.3)*.25,dt*8);
  tail.rotation.y=THREE.MathUtils.lerp(tail.rotation.y,Math.sin(t*8)*.35,dt*6);

  const lift=jump?0.2:0;
  legs.fl.leg.rotation.x=swing+lift;
  legs.br.leg.rotation.x=swing+lift;
  legs.fr.leg.rotation.x=-swing+lift;
  legs.bl.leg.rotation.x=-swing+lift;
}

function reset(){
  score=0;t=0;dist=0;speed=22;distToNext=14;
  lane=1;laneX=0;vy=0;grounded=true;jumps=0;inv=0;shake=0;
  animal.position.set(0,0,0);
  animal.rotation.set(0,0,0);
  playPose('run');
  for(const o of obstacles){scene.remove(o);disposeObj(o);}
  obstacles.length=0;
  updHUD();
}

function updHUD(){
  scoreEl.textContent=Math.floor(score);
  multEl.textContent='連分 x'+(1+Math.min(9,Math.floor(dist/120)));
  bestEl.textContent='最佳 '+Math.floor(best);
}

function start(){
  reset();
  running=true;
  overlay.classList.add('hidden');
  last=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  running=false;
  if(score>best){
    best=Math.floor(score);
    localStorage.setItem('animal_best',best);
  }
  overlay.querySelector('h2').textContent='💥 撞到了！';
  overlay.querySelector('p').innerHTML='最終得分 <b style="color:#4fd1ff">'+Math.floor(score)+'</b><br>再跑一次挑戰更高分！';
  btn.textContent='再玩一次';
  overlay.classList.remove('hidden');
  bestEl.textContent='最佳 '+Math.floor(best);
  playPose('fall');
}

function doJump(){
  if(jumps<2){
    vy=JUMP*(jumps===0?1:.85);
    grounded=false;
    jumps++;
    playPose('jump');
  }
}

function setLane(i){
  lane=Math.max(0,Math.min(2,i));
}

addEventListener('keydown',e=>{
  if(!running)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA')setLane(lane-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')setLane(lane+1);
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault();
    doJump();
  }
});
function bind(id,fn){
  document.getElementById(id).addEventListener('pointerdown',e=>{
    e.preventDefault();
    fn();
  });
}
bind('bLeft',()=>setLane(lane-1));
bind('bRight',()=>setLane(lane+1));
bind('bJump',()=>doJump());
renderer.domElement.addEventListener('pointerdown',()=>{if(running)doJump();});

let tx=0;
addEventListener('touchstart',e=>{if(e.touches.length)tx=e.touches[0].clientX;});
addEventListener('touchend',e=>{
  if(!running)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40)setLane(lane+(dx>0?1:-1));
});
btn.addEventListener('click',start);

function update(dt){
  t+=dt;
  speed+=dt*1.2;
  dist+=speed*dt;
  const mult=1+Math.min(9,Math.floor(dist/120));
  score+=speed*dt*mult*0.1;
  laneX=THREE.MathUtils.lerp(laneX,LANES[lane],Math.min(1,dt*12));
  animal.position.x=laneX;
  animal.rotation.z=THREE.MathUtils.lerp(animal.rotation.z,(LANES[lane]-laneX)*-.4,dt*10);

  if(!grounded){
    vy+=GRAV*dt;
    const ny=animal.position.y+vy*dt;
    if(ny<=0){
      animal.position.y=0;
      grounded=true;
      jumps=0;
      vy=0;
      playPose('run');
    }else{
      animal.position.y=ny;
    }
  }

  animal.rotation.x=grounded?0:THREE.MathUtils.lerp(animal.rotation.x,-.35,dt*8);
  animateFox(dt);

  inv=Math.max(0,inv-dt);
  shake=Math.max(0,shake-dt*2);
  distToNext-=speed*dt;
  if(distToNext<=0){
    const o=makeObstacle();
    const li=Math.floor(Math.random()*3);
    o.position.set(LANES[li],0,-dist);
    if(Math.random()<.25){
      const o2=makeObstacle();
      o2.position.set(LANES[(li+1+Math.floor(Math.random()*2))%3],0,-dist);
      obstacles.push(o2);
    }
    obstacles.push(o);
    distToNext=Math.max(8,15-speed*0.15)+Math.random()*6;
  }

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.position.z+=speed*dt;
    if(o.position.z>-1&&o.position.z<1.2&&inv<=0){
      const dx=Math.abs(o.position.x-laneX);
      if(dx<1.4&&animal.position.y<o.userData.h){
        shake=1;
        endGame();
        return;
      }
    }
    if(o.position.z>10){
      scene.remove(o);
      disposeObj(o);
      obstacles.splice(i,1);
    }
  }

  camera.position.set(laneX*.5,4+animal.position.y*.4,7);
  camera.lookAt(laneX*.5,1.4,-10);
  if(shake>0)camera.position.x+=(Math.random()-.5)*shake;
  updHUD();
}

function loop(now){
  if(!running)return;
  let dt=(now-last)/1000;
  last=now;
  dt=Math.min(dt,.05);
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
document.addEventListener('dblclick',e=>e.preventDefault());
renderer.render(scene,camera);
</script>
</body>
</html>
